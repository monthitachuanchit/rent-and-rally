<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rent and Rally – Tennis Racquet Rental</title>
<style>
:root{--bg:#FAF9ED;--card:#FCFCFA;--ink:#0A3E30;--mut:#5f776c;--brand:#0A3E30;--acc:#B5CE59;--soft:#EDF0D2;--line:#E4E7D0;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#16251b;--ink:#eaf3e6;--mut:#9db3a2;--brand:#B5CE59;--soft:#1d3024;--line:#26392c;--bad:#ff8a80;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Nunito","Quicksand",system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;line-height:1.55}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo img{width:42px;height:42px;border-radius:50%}
nav{display:flex;gap:8px;align-items:center}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--brand);background:var(--brand);color:var(--bg);padding:9px 20px;border-radius:99px;text-decoration:none;display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) .btn{color:#0f1a13}}
button.ghost{background:transparent;color:var(--brand)}
button.sm{padding:5px 12px;font-size:14px}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.35;cursor:not-allowed}
.hero{padding:28px 20px 36px;text-align:center}
.hero img{width:170px;height:170px;border-radius:50%}
.hero h1{margin:14px 0 6px;font-size:clamp(28px,6vw,42px);letter-spacing:-.5px}
.hero p{margin:0 auto 18px;max-width:480px;color:var(--mut)}
main{max-width:960px;margin:0 auto;padding:12px 20px 20px}
h2{margin:36px 0 14px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:20px}
.dates{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:3px}
input,select{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.rq{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rq .img{height:110px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:44px}
.rq h3{margin:4px 0 0}.price{font-weight:800}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 11px;border-radius:99px;background:var(--soft);color:var(--brand)}
.tag.no{background:#fbe3e0;color:var(--bad)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.steps li{background:var(--soft);border-radius:18px;padding:16px}
.steps b{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--acc);color:#0A3E30;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
dialog{border:2px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);max-width:420px;width:92%}
dialog::backdrop{background:rgba(10,62,48,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.note{font-size:13px;color:var(--mut)}
footer{text-align:center;padding:28px;color:var(--mut);font-size:14px}
[hidden]{display:none!important}
</style>
</head>

  <a class="btn" href="#rackets" data-i="cta"></a>
</section>

<main>
  <div id="shop">
    <div class="panel">
      <div class="dates">
        <div><label data-i="from"></label><input type="date" id="d1"></div>
        <div><label data-i="to"></label><input type="date" id="d2"></div>
        <div id="daysInfo" class="note"></div>
      </div>
    </div>
    <h2 id="rackets" data-i="pick"></h2>
    <div id="list" class="grid"></div>

    <h2 data-i="how"></h2>
    <ol class="steps">
      <li><b>1.</b> <span data-i="s1"></span></li>
      <li><b>2.</b> <span data-i="s2"></span></li>
      <li><b>3.</b> <span data-i="s3"></span></li>
      <li><b>4.</b> <span data-i="s4"></span></li>
    </ol>

    <div id="mine" class="panel" hidden style="margin-top:20px">
      <h3 data-i="mybk" style="margin-top:0"></h3>
      <div class="scroll"><table id="mineT"></table></div>
    </div>

    <h2 data-i="faq"></h2>
    <div class="panel"><b data-i="q1"></b><div data-i="a1"></div><br><b data-i="q2"></b><div data-i="a2"></div></div>
  </div>

  <div id="admin" hidden>
    <div class="panel">
      <h3 style="margin-top:0" data-i="stock"></h3>
      <div class="scroll"><table id="stockT"></table></div>
      <h4 data-i="addNew"></h4>
      <div class="row">
        <div><label data-i="name"></label><input id="nName" placeholder="Wilson Blade 98"></div>
        <div><label data-i="priceDay"></label><input id="nPrice" type="number" min="0" value="250"></div>
        <div><label data-i="qty"></label><input id="nStock" type="number" min="0" value="2"></div>
      </div>
      <p><button id="addBtn" data-i="add"></button></p>
    </div>
    <div class="panel">
      <h3 style="margin-top:0" data-i="allBk"></h3>
      <div class="scroll"><table id="bkT"></table></div>
    </div>
    <p class="note" data-i="adminNote"></p>
  </div>
</main>

<dialog id="dlg">
  <h3 style="margin-top:0" data-i="reserve"></h3>
  <p id="sum" class="note"></p>
  <div style="display:grid;gap:10px">
    <div><label data-i="yourName"></label><input id="cName"></div>
    <div><label data-i="phone"></label><input id="cPhone" type="tel"></div>
    <div><label data-i="lineId"></label><input id="cLine"></div>
    <div><label data-i="qty"></label><input id="cQty" type="number" min="1" value="1"></div>
  </div>
  <p class="row" style="margin-top:14px"><button class="ghost" id="cancelD" data-i="cancel"></button><button id="sendD" data-i="send"></button></p>
  <p class="note" data-i="lineNote"></p>
</dialog>

<footer>© Rent and Rally · mockup · <span data-i="foot"></span></footer>

<script>
const LINE_OA = "@rentandrally"; // TODO: replace with your real LINE Official Account ID
const T = {
 en:{h1:"Tennis gear for more play",sub:"Rent a racquet, hit the court. Check dates, reserve in minutes.",cta:"Find a racquet",pick:"Pick your racquet",from:"Pick-up date",to:"Return date",how:"How it works",s1:"Choose your dates and racquet.",s2:"Tap Reserve and send your request to us on LINE.",s3:"We confirm your booking on this website and on LINE.",s4:"Pick up, play, return. Have fun!",faq:"FAQ",q1:"Is a deposit required?",a1:"Placeholder: a refundable deposit may apply. Details to be confirmed.",q2:"Where do I pick up?",a2:"Placeholder: pick-up location and hours to be confirmed.",perDay:"/ day",avail:"available",none:"Fully booked",reserve:"Reserve",days:"day(s)",total:"Total",pickDates:"Select valid dates",yourName:"Your name",phone:"Phone",lineId:"Your LINE ID",qty:"Quantity",cancel:"Cancel",send:"Send via LINE",lineNote:"Your request is saved here as pending, then LINE opens with the details so you can send it to us.",mybk:"My bookings",stock:"Racquets & stock",addNew:"Add a new racquet",name:"Name",priceDay:"Price / day (THB)",add:"Add racquet",allBk:"All bookings",adminNote:"Mockup: admin controls appear only for the page owner / editors.",foot:"Content is placeholder",pending:"Pending",confirmed:"Confirmed",cancelled:"Cancelled",confirm:"Confirm",remove:"Remove",save:"Save",admin:"⚙ Admin",shop:"← Shop",empty:"No racquets yet.",signin:"Sign in to Claude to make live reservations in this preview."},
 th:{h1:"เช่าไม้เทนนิส เล่นได้มากขึ้น",sub:"เช่าไม้ ลงสนามได้เลย เช็กวันว่างและจองได้ในไม่กี่นาที",cta:"เลือกไม้เทนนิส",pick:"เลือกไม้ของคุณ",from:"วันรับไม้",to:"วันคืนไม้",how:"ขั้นตอนการเช่า",s1:"เลือกวันที่และไม้เทนนิส",s2:"กดจอง แล้วส่งคำขอถึงเราทาง LINE",s3:"เรายืนยันการจองทางเว็บไซต์และ LINE",s4:"รับไม้ เล่น แล้วนำมาคืน สนุกนะคะ!",faq:"คำถามที่พบบ่อย",q1:"ต้องวางมัดจำไหม?",a1:"ตัวอย่าง: อาจมีเงินมัดจำที่คืนได้ รายละเอียดจะแจ้งภายหลัง",q2:"รับไม้ที่ไหน?",a2:"ตัวอย่าง: สถานที่และเวลารับไม้จะแจ้งภายหลัง",perDay:"/ วัน",avail:"ว่าง",none:"เต็มแล้ว",reserve:"จอง",days:"วัน",total:"รวม",pickDates:"กรุณาเลือกวันที่ให้ถูกต้อง",yourName:"ชื่อของคุณ",phone:"เบอร์โทร",lineId:"LINE ID ของคุณ",qty:"จำนวน",cancel:"ยกเลิก",send:"ส่งผ่าน LINE",lineNote:"ระบบจะบันทึกคำขอเป็น “รอยืนยัน” แล้วเปิด LINE พร้อมรายละเอียดให้คุณส่งถึงเรา",mybk:"การจองของฉัน",stock:"ไม้เทนนิสและสต็อก",addNew:"เพิ่มไม้ใหม่",name:"ชื่อรุ่น",priceDay:"ราคา / วัน (บาท)",add:"เพิ่มไม้",allBk:"การจองทั้งหมด",adminNote:"ตัวอย่าง: เมนูแอดมินจะแสดงเฉพาะเจ้าของ/ผู้แก้ไขหน้านี้",foot:"เนื้อหาเป็นตัวอย่าง",pending:"รอยืนยัน",confirmed:"ยืนยันแล้ว",cancelled:"ยกเลิก",confirm:"ยืนยัน",remove:"ลบ",save:"บันทึก",admin:"⚙ แอดมิน",shop:"← หน้าร้าน",empty:"ยังไม่มีไม้เทนนิส",signin:"ลงชื่อเข้าใช้ Claude เพื่อจองจริงในตัวอย่างนี้"}
};
const DEFAULTS=[{id:"ezone100",name:"Yonex EZONE 100",pricePerDay:300,stock:3,emoji:"🎾"},{id:"puredrive",name:"Babolat Pure Drive",pricePerDay:300,stock:3,emoji:"🎾"}];
let lang="en",racquets=[],bookings=[],db=null,canEdit=false,pick=null;
const $=id=>document.getElementById(id);
const t=k=>T[lang][k]||k;
const safeLS={get(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const iso=d=>d.toISOString().slice(0,10);
const today=new Date();$("d1").value=iso(today);$("d2").value=iso(new Date(today.getTime()+2*864e5));
$("d1").min=iso(today);

function days(){const a=new Date($("d1").value),b=new Date($("d2").value);if(isNaN(a)||isNaN(b)||b<a)return 0;return Math.round((b-a)/864e5)+1}
function used(r){const s=$("d1").value,e=$("d2").value;return bookings.filter(b=>b.racquetId===r.id&&b.status!=="cancelled"&&b.start<=e&&b.end>=s).reduce((n,b)=>n+(b.qty||1),0)}
function left(r){return Math.max(0,(r.stock||0)-used(r))}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("langBtn").textContent=lang==="en"?"ไทย":"EN";
  $("adminBtn").textContent=$("admin").hidden?t("admin"):t("shop");
  render();
}
function render(){
  const n=days();
  $("daysInfo").textContent=n?n+" "+t("days"):t("pickDates");
  const list=racquets.length?racquets:[];
  $("list").innerHTML=list.length?"":`<p>${t("empty")}</p>`;
  list.forEach(r=>{
    const a=left(r),el=document.createElement("div");el.className="rq";
    el.innerHTML=`<div class="img">🎾</div><h3></h3><div class="price">฿${r.pricePerDay} ${t("perDay")}</div><div><span class="tag ${a?"":"no"}">${a?a+" "+t("avail"):t("none")}</span></div>`;
    el.querySelector("h3").textContent=r.name;
    const b=document.createElement("button");b.textContent=t("reserve");b.disabled=!a||!n;
    b.onclick=()=>openDlg(r);el.appendChild(b);$("list").appendChild(el);
  });
  const ids=safeLS.get("rr_mine"),mine=bookings.filter(b=>ids.includes(b.id));
  $("mine").hidden=!mine.length;
  $("mineT").innerHTML=mine.map(b=>`<tr><td>${esc(b.racquetName)} ×${b.qty}</td><td>${b.start} → ${b.end}</td><td><span class="tag ${b.status==="cancelled"?"no":""}">${t(b.status)}</span></td></tr>`).join("");
  if(canEdit)renderAdmin();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderAdmin(){
  $("stockT").innerHTML=racquets.map(r=>`<tr><td>${esc(r.name)}</td><td>฿<input type="number" style="width:84px" value="${r.pricePerDay}" data-p="${r.id}"></td><td><input type="number" style="width:70px" value="${r.stock}" data-s="${r.id}"></td><td><button class="sm" data-save="${r.id}">${t("save")}</button> <button class="sm danger" data-del="${r.id}">${t("remove")}</button></td></tr>`).join("");
  $("stockT").querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const id=b.dataset.save;db.collection("racquets").doc(id).update({pricePerDay:+$("stockT").querySelector(`[data-p="${id}"]`).value,stock:+$("stockT").querySelector(`[data-s="${id}"]`).value}).catch(console.error)});
  $("stockT").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>db.collection("racquets").doc(b.dataset.del).delete().catch(console.error));
  $("bkT").innerHTML=bookings.sort((a,b)=>(b.created||0)-(a.created||0)).map(b=>`<tr><td>${esc(b.customer)}<br><span class="note">${esc(b.phone)} · ${esc(b.line)}</span></td><td>${esc(b.racquetName)} ×${b.qty}</td><td>${b.start} → ${b.end}<br><span class="note">฿${b.total}</span></td><td><span class="tag ${b.status==="cancelled"?"no":""}">${t(b.status)}</span></td><td><button class="sm" data-c="${b.id}">${t("confirm")}</button> <button class="sm danger" data-x="${b.id}">${t("cancel")}</button></td></tr>`).join("");
  $("bkT").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>db.collection("bookings").doc(b.dataset.c).update({status:"confirmed"}));
  $("bkT").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>db.collection("bookings").doc(b.dataset.x).update({status:"cancelled"}));
}

function openDlg(r){
  pick=r;const n=days();$("cQty").max=left(r);$("cQty").value=1;
  const upd=()=>$("sum").textContent=`${r.name} · ${$("d1").value} → ${$("d2").value} · ${t("total")} ฿${r.pricePerDay*n*(+$("cQty").value||1)}`;
  $("cQty").oninput=upd;upd();$("dlg").showModal();
}
$("cancelD").onclick=()=>$("dlg").close();
$("sendD").onclick=async()=>{
  const r=pick,n=days(),q=Math.min(Math.max(1,+$("cQty").value||1),left(r));
  if(!$("cName").value.trim()||!$("cPhone").value.trim())return;
  const bk={racquetId:r.id,racquetName:r.name,qty:q,start:$("d1").value,end:$("d2").value,total:r.pricePerDay*n*q,customer:$("cName").value.trim(),phone:$("cPhone").value.trim(),line:$("cLine").value.trim(),status:"pending",created:Date.now()};
  try{
    if(db){const ref=await db.collection("bookings").add(bk);safeLS.set("rr_mine",[...safeLS.get("rr_mine"),ref.id])}
    else alert(t("signin"));
  }catch(e){console.error(e)}
  const msg=`Rent and Rally booking request\n${bk.racquetName} x${q}\n${bk.start} to ${bk.end}\nTotal: ${bk.total} THB\nName: ${bk.customer}\nPhone: ${bk.phone}\nLINE: ${bk.line}`;
  window.open("https://line.me/R/oaMessage/"+encodeURIComponent(LINE_OA)+"/?"+encodeURIComponent(msg),"_blank");
  $("dlg").close();
};
$("d1").onchange=()=>{if($("d2").value<$("d1").value)$("d2").value=$("d1").value;render()};
$("d2").onchange=render;
$("langBtn").onclick=()=>{lang=lang==="en"?"th":"en";applyLang()};
$("adminBtn").onclick=()=>{$("admin").hidden=!$("admin").hidden;$("shop").hidden=!$("shop").hidden;applyLang()};
$("addBtn").onclick=()=>{const nm=$("nName").value.trim();if(!nm||!db)return;db.collection("racquets").add({name:nm,pricePerDay:+$("nPrice").value||0,stock:+$("nStock").value||0}).then(()=>$("nName").value="").catch(console.error)};

racquets=DEFAULTS;applyLang();
(async()=>{
  try{
    const user=await claude.use("user");canEdit=!!(user&&user.canEdit());$("adminBtn").hidden=!canEdit;
    db=await claude.use("db");if(!db)return;
    let timer=setTimeout(()=>{},10000);
    db.collection("racquets").onSnapshot(s=>{clearTimeout(timer);if(!s.empty){racquets=s.docs.map(d=>({id:d.id,...d.data()}))}render()},e=>console.error(e));
    db.collection("bookings").onSnapshot(s=>{bookings=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e));
  }catch(e){console.error(e)}
})();
</script>
</body>
</html>
